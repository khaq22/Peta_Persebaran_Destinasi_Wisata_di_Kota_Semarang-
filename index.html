    const camelCase = (str) => str.replace(/-([a-z])/g, (g) => g[1].toUpperCase());

    const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
      const iconNode = window.lucide.icons[name];
      if (!iconNode) return null;

      // Mendukung format struktur array Lucide versi baru dan lama
      const childrenNodes = Array.isArray(iconNode[0]) ? iconNode : (iconNode[2] || []);

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={2}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          {...props}
        >
          {childrenNodes.map(([tag, attrs], index) => {
            const reactAttrs = {};
            for (const [key, value] of Object.entries(attrs || {})) {
              reactAttrs[camelCase(key)] = value;
            }
            return React.createElement(tag, { key: index, ...reactAttrs });
          })}
        </svg>
      );
    };

                        {/* Switch UI */}
                        <div className={`w-10 h-6 rounded-full relative shrink-0 transition-colors duration-300 ${isLocationEnabled ? 'bg-blue-500' : 'bg-slate-300'}`}>
                          <div className={`w-4 h-4 bg-white rounded-full absolute top-1 shadow-sm transition-all duration-300 ${isLocationEnabled ? 'left-5' : 'left-1'}`}></div>
                        </div>
                      </div>

                      <button className="w-full text-center py-2 text-xs font-semibold text-rose-500 hover:text-rose-600 transition-colors mt-2">
                        Delete Account
                      </button>
                    </div>
                  )}
                </div>

                {/* LOG OUT */}
                <button
                  onClick={onLogout}
                  className="w-full flex items-center gap-4 bg-rose-50 p-4 rounded-2xl border border-rose-100 hover:bg-rose-100 transition-colors mt-4"
                >
                  <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center text-rose-500 shadow-sm">
                    <LogOut size={20} />
                  </div>
                  <div className="text-left flex-1">
                    <h4 className="text-rose-600 font-medium">Log Out</h4>
                  </div>
                </button>

              </div>
            )}
          </div>
        </div>
      );
    };

    const DetailScreen = ({ locationId, onBack, onNavigateToNearby }) => {
      const [selectedNearby, setSelectedNearby] = useState(null);
      const destination = DESTINATIONS.find((d) => d.id === locationId) || DESTINATIONS[0];
      const nearbyIds = NEARBY_MAPPING[destination.id] || ["simpang-lima", "lawang-sewu", "kota-lama"];
      const nearbyDestinations = DESTINATIONS.filter(d => nearbyIds.includes(d.id));

      return (
        <div className="h-full bg-slate-50 relative overflow-hidden">
          <div className="absolute top-0 w-full h-[45%]">
            <img src={destination.image} alt={destination.name} className="w-full h-full object-cover" />
            <div className="absolute inset-0 bg-gradient-to-t from-slate-50 via-transparent to-black/30"></div>
            <div className="absolute top-12 left-5 right-5 flex justify-between z-20">
              <button onClick={onBack} className="w-10 h-10 rounded-full bg-white/50 backdrop-blur-md border border-white/40 flex items-center justify-center text-slate-900 shadow-sm hover:bg-white/70 transition-colors">
                <ChevronLeft size={24} />
              </button>
              <button className="w-10 h-10 rounded-full bg-white/50 backdrop-blur-md border border-white/40 flex items-center justify-center text-slate-900 shadow-sm hover:bg-white/70 transition-colors">
                <MoreHorizontal size={24} />
              </button>
            </div>
          </div>

          <div className="absolute top-[40%] w-full h-[60%] bg-white rounded-t-[32px] px-6 pt-8 pb-8 flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-10 border-t border-slate-100">
            <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto absolute top-3 left-1/2 -translate-x-1/2"></div>
            <div className="flex-1 overflow-y-auto no-scrollbar pb-24">
              <div className="mb-4">
                <h1 className="text-[26px] font-semibold text-slate-900 mb-2 leading-tight">{destination.name}</h1>
                <div className="flex items-center gap-2 mb-4">
                  <span className={`w-2.5 h-2.5 rounded-full ${destination.statusColor.replace("text-", "bg-")} animate-pulse`}></span>
                  <span className={`text-sm font-medium ${destination.statusColor}`}>{destination.status}</span>
                </div>
                <p className="text-slate-600 text-[15px] leading-relaxed mb-8">{destination.desc}</p>
              </div>

              <h3 className="text-slate-800 font-medium text-lg mb-4">Nearby Places</h3>
              <div className="flex gap-4 overflow-x-auto no-scrollbar pb-2 -mx-6 px-6">
                {nearbyDestinations.map((nearbyDest) => (
                  <div
                    key={nearbyDest.id}
                    onClick={() => setSelectedNearby(nearbyDest)}
                    className="min-w-[140px] max-w-[140px] bg-slate-50 rounded-[20px] p-2 border border-slate-100 shadow-sm cursor-pointer hover:bg-slate-100 transition-colors shrink-0"
                  >
                    <img src={nearbyDest.image} className="w-full h-[85px] rounded-2xl object-cover mb-2" alt={nearbyDest.name} />
                    <h4 className="text-sm font-medium text-slate-800 px-1 truncate">{nearbyDest.name}</h4>
                  </div>
                ))}
              </div>
            </div>

            <div className="absolute bottom-6 left-6 right-6">
              <button className="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white py-4 rounded-[20px] font-semibold text-[17px] shadow-[0_8px_30px_rgba(79,70,229,0.3)] transition-transform hover:scale-[1.02] active:scale-[0.98]">
                Add to Trip
              </button>
            </div>
          </div>

          {selectedNearby && (
            <div className="absolute inset-0 z-[100] flex items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 sm:p-0 transition-opacity">
              <div className="bg-white w-full max-w-md sm:rounded-[24px] rounded-t-[24px] rounded-b-none sm:rounded-b-[24px] overflow-hidden shadow-2xl animate-in slide-in-from-bottom-8 relative flex flex-col max-h-[90%]">
                <div className="h-56 w-full relative shrink-0">
                  <img src={selectedNearby.image} alt={selectedNearby.name} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent"></div>
                  <button onClick={() => setSelectedNearby(null)} className="absolute top-4 right-4 bg-white/20 hover:bg-white/40 backdrop-blur-md p-2 rounded-full text-white transition">
                    <X size={20} />
                  </button>
                  <div className="absolute bottom-4 left-4 right-4">
                    <h2 className="text-2xl font-bold text-white mb-1">{selectedNearby.name}</h2>
                    <div className="flex flex-wrap items-center gap-2 text-sm text-white/90">
                      <div className="flex items-center gap-1 bg-black/30 backdrop-blur-md px-2 py-1 rounded-full">
                        <Star size={14} className="text-yellow-400 fill-yellow-400" />
                        <span className="font-semibold">{selectedNearby.rating}</span>
                      </div>
                    </div>
                  </div>
                </div>
                
                <div className="p-6 overflow-y-auto no-scrollbar">
                  <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-4">
                    <h4 className="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                      <MapPin size={14} className="fill-blue-600" /> Keterangan Destinasi
                    </h4>
                    <p className="text-slate-600 text-sm leading-relaxed">{selectedNearby.desc}</p>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const QrisScreen = () => {
      const videoRef = useRef(null);
      const [hasError, setHasError] = useState(false);

      useEffect(() => {
        let currentStream = null;

        // Fungsi untuk menyalakan kamera
        const startCamera = async () => {
          try {
            // Meminta akses video, diutamakan kamera belakang (environment) kalau di HP
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" }
            });
            
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
            }
            currentStream = stream;
          } catch (err) {
            console.error("Gagal mengakses kamera:", err);
            setHasError(true);
          }
        };

        startCamera();

        // Cleanup: Matikan kamera saat user pindah ke tab lain (Home/Map/dll)
        return () => {
          if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
          }
        };
      }, []);

      return (
        <div className="h-full flex flex-col bg-slate-900 relative">
          <div className="absolute inset-0 bg-slate-900 z-0 overflow-hidden">
            {/* Real Camera Feed */}
            {hasError ? (
              <div className="w-full h-full flex flex-col items-center justify-center p-6 text-center">
                <Shield size={40} className="text-slate-500 mb-3" />
                <p className="text-slate-400 text-sm">
                  Kamera tidak dapat diakses.<br/>Pastikan Anda telah memberikan izin kamera pada browser.
                </p>
              </div>
            ) : (
              <video
                ref={videoRef}
                autoPlay
                playsInline
                muted
                className="w-full h-full object-cover opacity-60 mix-blend-luminosity"
              />
            )}
          </div>

          <div className="relative z-10 flex flex-col items-center justify-center h-full px-6 pt-12 pb-24 pointer-events-none">
            <h2 className="text-white text-xl font-bold mb-8 tracking-wide drop-shadow-md">Scan QRIS</h2>
            
            {/* Bingkai Scanner */}
            <div className="relative w-64 h-64 mb-8">
              <div className="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-blue-500 rounded-tl-2xl"></div>
              <div className="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-blue-500 rounded-tr-2xl"></div>
              <div className="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-blue-500 rounded-bl-2xl"></div>
              <div className="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-blue-500 rounded-br-2xl"></div>
              
              {/* Garis Animasi Scanning */}
              <div className="w-full h-0.5 bg-blue-400 absolute top-1/2 animate-[ping_2.5s_ease-in-out_infinite] shadow-[0_0_15px_rgba(59,130,246,1)]"></div>
            </div>

            {/* Tombol Upload (pointer-events-auto agar bisa diklik) */}
            <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl w-full max-w-sm flex items-center justify-between border border-white/20 cursor-pointer hover:bg-white/20 transition pointer-events-auto">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                  <QrCode size={20} className="text-slate-900" />
                </div>
                <div>
                  <p className="text-white font-medium text-sm">Upload dari Galeri</p>
                </div>
              </div>
              <ChevronLeft size={20} className="text-white rotate-180" />
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [appState, setAppState] = useState("landing");
      const [activeTab, setActiveTab] = useState("home");
      const [activeLocation, setActiveLocation] = useState(null);

      const isViewingDetail = activeLocation !== null;

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-2 sm:p-4">
          <div className="relative w-full max-w-[400px] h-[850px] max-h-[95vh] bg-slate-50 rounded-[35px] sm:rounded-[40px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden border-[6px] sm:border-[8px] border-slate-800 mx-auto flex flex-col">
            
            {appState === "landing" && <LandingScreen onNavigate={setAppState} />}
            {appState === "login" && <LoginScreen onNavigate={setAppState} onLogin={() => setAppState("main")} />}
            {appState === "signup" && <SignUpScreen onNavigate={setAppState} onLogin={() => setAppState("main")} />}

            {appState === "main" && (
              <>
                <div className={!isViewingDetail && activeTab === "home" ? "h-full" : "hidden"}>
                  <HomeScreen
                    onNavigateToRoute={() => setActiveTab("route")}
                    onNavigateToDetail={(id) => setActiveLocation(id)}
                    onNavigateToProfile={() => setActiveTab("profile")}
                  />
                </div>

                <div className={!isViewingDetail && activeTab === "route" ? "h-full" : "hidden"}>
                  <RouteScreen onBack={() => setActiveTab("home")} />
                </div>

                <div className={!isViewingDetail && activeTab === "map" ? "h-full" : "hidden"}>
                  <MapScreen />
                </div>

                <div className={!isViewingDetail && activeTab === "profile" ? "h-full" : "hidden"}>
                  <ProfileScreen
                    onLogout={() => {
                      setAppState("landing");
                      setActiveTab("home");
                    }}
                  />
                </div>

                {/* Layar QRIS yang baru ditambahkan */}
                <div className={!isViewingDetail && activeTab === "qris" ? "h-full" : "hidden"}>
                  <QrisScreen />
                </div>

                {isViewingDetail && (
                  <DetailScreen
                    locationId={activeLocation}
                    onBack={() => setActiveLocation(null)}
                    onNavigateToNearby={(id) => setActiveLocation(id)}
                  />
                )}

                {!isViewingDetail && (
                  <BottomNavBar activeTab={activeTab} onTabChange={setActiveTab} />
                )}
              </>
            )}

            <div className="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-200 rounded-full z-[100] pointer-events-none"></div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
